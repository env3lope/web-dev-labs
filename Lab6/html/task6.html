<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <title>Lab6</title>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        #gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 15px;
            max-width: 600px;
        }

        #gallery img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border: 1px solid black;
        }

        button {
            padding: 8px 12px;
        }
    </style>
    <script src="../task6.js" defer></script>
</head>

<body>
    <button id="btn">Завантажити собак</button>
    <div id="gallery"></div>
</body>

</html>
